<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart | NovaShop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Nova<span>Shop</span></a>
            <a href="products.html" class="nav-btn"><i class="fas fa-arrow-left"></i> Continue Shopping</a>
        </div>
    </nav>

    <section class="section cart-page-container">
        <div class="cart-items-wrapper">
            <h2>Your Shopping Cart (<span id="cart-title-count">0</span>)</h2>
            <div id="cart-list">
                </div>
        </div>

        <aside class="cart-summary-panel">
            <h3>Order Summary</h3>
            <hr>
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal-cost">$0.00</span>
            </div>
            <div class="summary-row">
                <span>Estimated Shipping</span>
                <span class="text-success">FREE</span>
            </div>
            <hr>
            <div class="summary-row total-row">
                <span>Total Due</span>
                <span id="total-cost">$0.00</span>
            </div>
            <button class="btn btn-primary checkout-btn" onclick="alert('Proceeding to Mock Checkout Gateway!')">Proceed to Checkout</button>
        </aside>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
