<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | NovaShop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Nova<span>Shop</span></a>
            <div class="search-bar">
                <input type="text" id="product-search" placeholder="Search across catalog...">
                <button><i class="fas fa-search"></i></button>
            </div>
            <div class="nav-actions">
                <a href="#" class="nav-btn"><i class="fas fa-user"></i> Login</a>
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="products-page-container section">
        <aside class="filter-sidebar">
            <h3>Filters</h3>
            <hr>
            <div class="filter-group">
                <h4>Category</h4>
                <label><input type="radio" name="category" value="all" checked> All</label>
                <label><input type="radio" name="category" value="Electronics"> Electronics</label>
                <label><input type="radio" name="category" value="Fashion"> Fashion</label>
                <label><input type="radio" name="category" value="Home Decor"> Home Decor</label>
            </div>
            
            <div class="filter-group">
                <h4>Sort By Price</h4>
                <select id="price-sort">
                    <option value="default">Select Sorting</option>
                    <option value="low-high">Price: Low to High</option>
                    <option value="high-low">Price: High to Low</option>
                </select>
            </div>
        </aside>

        <main class="products-display">
            <div class="product-grid" id="catalog-grid">
                </div>
        </main>
    </div>

    <div id="toast-container"></div>
    <script src="js/script.js"></script>
</body>
</html>
